[project]
name = "conlabs-python-base"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncmy>=0.2.16",
    "asyncpg>=0.32.0",
    "concurrent-log-handler>=0.9.30",
    "fastapi>=0.156.4",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "pytest>=9.1.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn>=0.54.0",
]

# 경로를 잡지 못할 때 처리
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest-asyncio>=1.4.1",
]

# DB를 설정해 둔 환경에서 처리할 수 있도록 드라이버 설정
[project.optional-dependencies]
sqlite = [
    "aiosqlite",
]
mysql = [
    "aiomysql>=0.3.2",
]
postgres = [
    "asyncpg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
